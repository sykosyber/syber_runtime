[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "syberruntime"
version = "0.1.0"
description = "Operation-primary local-first runtime kernel for SyberRuntime."
requires-python = ">=3.11"
dependencies = []

[project.scripts]
syber = "syberruntime.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
